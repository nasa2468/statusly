name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Build binaries
        run: |
          go mod tidy
          mkdir -p dist
          GOOS=linux   GOARCH=amd64 CGO_ENABLED=1 go build -ldflags="-s -w" -o dist/statusly-linux-amd64   ./cmd/statusly
          GOOS=linux   GOARCH=arm64 CGO_ENABLED=1 go build -ldflags="-s -w" -o dist/statusly-linux-arm64   ./cmd/statusly
          GOOS=darwin  GOARCH=amd64 CGO_ENABLED=1 go build -ldflags="-s -w" -o dist/statusly-darwin-amd64  ./cmd/statusly
          GOOS=darwin  GOARCH=arm64 CGO_ENABLED=1 go build -ldflags="-s -w" -o dist/statusly-darwin-arm64  ./cmd/statusly
          GOOS=windows GOARCH=amd64 CGO_ENABLED=1 go build -ldflags="-s -w" -o dist/statusly-windows-amd64.exe ./cmd/statusly

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
