<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Statusly</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: { 500: '#6366f1', 600: '#4f46e5' }
          }
        }
      }
    }
  </script>
  <style>
    body { font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  </style>
</head>
<body class="bg-gray-50 dark:bg-gray-950 text-gray-900 dark:text-gray-100 min-h-screen transition-colors">
  <div class="max-w-4xl mx-auto px-4 py-10">
    <!-- Header -->
    <header class="flex items-center justify-between mb-10">
      <div>
        <h1 id="title" class="text-3xl font-bold tracking-tight">Statusly</h1>
        <p id="description" class="text-gray-500 dark:text-gray-400 mt-1">Loading status...</p>
      </div>
      <div class="flex items-center gap-3">
        <button id="theme-toggle" class="p-2 rounded-lg hover:bg-gray-200 dark:hover:bg-gray-800 transition">
          <span class="dark:hidden">🌙</span>
          <span class="hidden dark:inline">☀️</span>
        </button>
        <div id="overall-badge" class="px-3 py-1 rounded-full text-sm font-medium bg-gray-200 text-gray-700">
          Checking...
        </div>
      </div>
    </header>

    <!-- Targets -->
    <section class="space-y-4 mb-12" id="targets">
      <!-- filled by JS -->
    </section>

    <!-- Incidents -->
    <section>
      <h2 class="text-xl font-semibold mb-4">Recent Incidents</h2>
      <div id="incidents" class="space-y-3">
        <p class="text-gray-500">No recent incidents 🎉</p>
      </div>
    </section>

    <footer class="mt-16 text-center text-sm text-gray-400">
      Powered by <a href="https://github.com/nasa2468/statusly" class="underline hover:text-brand-500">Statusly</a>
    </footer>
  </div>

  <script>
    // Theme
    const html = document.documentElement;
    const saved = localStorage.getItem('theme');
    if (saved === 'dark' || (!saved && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
      html.classList.add('dark');
    }
    document.getElementById('theme-toggle').addEventListener('click', () => {
      html.classList.toggle('dark');
      localStorage.setItem('theme', html.classList.contains('dark') ? 'dark' : 'light');
    });

    async function load() {
      try {
        const res = await fetch('/api/status');
        const data = await res.json();

        document.getElementById('title').textContent = data.title || 'Statusly';
        document.getElementById('description').textContent = data.description || '';

        const badge = document.getElementById('overall-badge');
        if (data.status === 'operational') {
          badge.textContent = 'All Systems Operational';
          badge.className = 'px-3 py-1 rounded-full text-sm font-medium bg-green-100 text-green-800 dark:bg-green-900/40 dark:text-green-300';
        } else {
          badge.textContent = 'Degraded Performance';
          badge.className = 'px-3 py-1 rounded-full text-sm font-medium bg-yellow-100 text-yellow-800 dark:bg-yellow-900/40 dark:text-yellow-300';
        }

        const container = document.getElementById('targets');
        container.innerHTML = '';

        (data.targets || []).forEach(t => {
          const card = document.createElement('div');
          card.className = 'bg-white dark:bg-gray-900 border border-gray-200 dark:border-gray-800 rounded-xl p-5 shadow-sm';

          const statusColor = t.up ? 'bg-green-500' : 'bg-red-500';
          const statusText = t.up ? 'Operational' : 'Down';

          card.innerHTML = `
            <div class="flex items-center justify-between">
              <div class="flex items-center gap-3">
                <span class="w-3 h-3 rounded-full ${statusColor}"></span>
                <div>
                  <h3 class="font-semibold">${t.target}</h3>
                  <p class="text-sm text-gray-500">${statusText}</p>
                </div>
              </div>
              <div class="text-right text-sm">
                <div class="font-medium">${t.uptime ? t.uptime.toFixed(2) + '%' : '—'}</div>
                <div class="text-gray-500">${t.avg_latency ? Math.round(t.avg_latency) + ' ms' : ''}</div>
              </div>
            </div>
          `;
          container.appendChild(card);
        });

        // Incidents
        const incRes = await fetch('/api/incidents');
        const incidents = await incRes.json();
        const incBox = document.getElementById('incidents');

        if (!incidents || incidents.length === 0) {
          incBox.innerHTML = '<p class="text-gray-500">No recent incidents 🎉</p>';
        } else {
          incBox.innerHTML = incidents.slice(0, 10).map(i => `
            <div class="bg-white dark:bg-gray-900 border border-gray-200 dark:border-gray-800 rounded-lg p-4 flex justify-between items-start">
              <div>
                <div class="font-medium text-red-600 dark:text-red-400">${i.Target || i.target}</div>
                <div class="text-sm text-gray-500 mt-1">${i.Error || i.error || 'Service unavailable'}</div>
              </div>
              <div class="text-xs text-gray-400 whitespace-nowrap ml-4">
                ${new Date(i.CheckedAt || i.checked_at).toLocaleString()}
              </div>
            </div>
          `).join('');
        }
      } catch (e) {
        console.error(e);
        document.getElementById('description').textContent = 'Failed to load status';
      }
    }

    load();
    setInterval(load, 30000); // refresh every 30s
  </script>
</body>
</html>
