<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Statusly</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: { 400: '#818cf8', 500: '#6366f1', 600: '#4f46e5' }
          }
        }
      }
    }
  </script>
  <style>
    body { font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
    .status-dot { box-shadow: 0 0 0 3px rgba(0,0,0,0.05); }
    .dark .status-dot { box-shadow: 0 0 0 3px rgba(255,255,255,0.05); }
  </style>
</head>
<body class="bg-gray-50 dark:bg-gray-950 text-gray-900 dark:text-gray-100 min-h-screen transition-colors duration-200">
  <div class="max-w-3xl mx-auto px-4 sm:px-6 py-10 sm:py-14">

    <!-- Header -->
    <header class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4 mb-12">
      <div>
        <h1 id="title" class="text-3xl sm:text-4xl font-bold tracking-tight">Statusly</h1>
        <p id="description" class="text-gray-500 dark:text-gray-400 mt-2 text-sm sm:text-base">Loading status...</p>
      </div>
      <div class="flex items-center gap-3">
        <button id="theme-toggle" class="p-2.5 rounded-xl hover:bg-gray-200 dark:hover:bg-gray-800 transition" title="Toggle theme">
          <span class="dark:hidden text-lg">🌙</span>
          <span class="hidden dark:inline text-lg">☀️</span>
        </button>
        <div id="overall-badge" class="px-4 py-1.5 rounded-full text-sm font-medium bg-gray-200 dark:bg-gray-800 text-gray-600 dark:text-gray-300">
          Checking...
        </div>
      </div>
    </header>

    <!-- Targets -->
    <section class="space-y-3 mb-14" id="targets">
      <div class="animate-pulse space-y-3">
        <div class="h-20 bg-gray-200 dark:bg-gray-800 rounded-2xl"></div>
        <div class="h-20 bg-gray-200 dark:bg-gray-800 rounded-2xl"></div>
      </div>
    </section>

    <!-- Incidents -->
    <section>
      <h2 class="text-lg font-semibold mb-4 flex items-center gap-2">
        <span>Recent Incidents</span>
      </h2>
      <div id="incidents" class="space-y-2.5">
        <p class="text-gray-500 dark:text-gray-400 text-sm">Loading...</p>
      </div>
    </section>

    <footer class="mt-20 pt-8 border-t border-gray-200 dark:border-gray-800 text-center text-sm text-gray-400">
      Powered by <a href="https://github.com/nasa2468/statusly" class="text-brand-500 hover:text-brand-400 underline underline-offset-2" target="_blank" rel="noopener">Statusly</a>
      <span class="mx-1">·</span>
      <span id="last-updated" class="text-gray-400"></span>
    </footer>
  </div>

  <script>
    // Theme handling
    const html = document.documentElement;
    const savedTheme = localStorage.getItem('theme');
    if (savedTheme === 'dark' || (!savedTheme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
      html.classList.add('dark');
    }
    document.getElementById('theme-toggle').addEventListener('click', () => {
      html.classList.toggle('dark');
      localStorage.setItem('theme', html.classList.contains('dark') ? 'dark' : 'light');
    });

    function formatTime(iso) {
      if (!iso) return '';
      const d = new Date(iso);
      return d.toLocaleString(undefined, {
        month: 'short', day: 'numeric',
        hour: '2-digit', minute: '2-digit'
      });
    }

    function formatRelative(iso) {
      if (!iso) return '';
      const diff = (Date.now() - new Date(iso).getTime()) / 1000;
      if (diff < 60) return 'just now';
      if (diff < 3600) return Math.floor(diff / 60) + 'm ago';
      if (diff < 86400) return Math.floor(diff / 3600) + 'h ago';
      return Math.floor(diff / 86400) + 'd ago';
    }

    async function load() {
      try {
        const res = await fetch('/api/status');
        if (!res.ok) throw new Error('Failed to fetch');
        const data = await res.json();

        document.getElementById('title').textContent = data.title || 'Statusly';
        document.getElementById('description').textContent = data.description || 'Service status overview';

        const badge = document.getElementById('overall-badge');
        if (data.status === 'operational') {
          badge.textContent = 'All Systems Operational';
          badge.className = 'px-4 py-1.5 rounded-full text-sm font-medium bg-emerald-100 text-emerald-800 dark:bg-emerald-900/50 dark:text-emerald-300';
        } else {
          badge.textContent = 'Degraded Performance';
          badge.className = 'px-4 py-1.5 rounded-full text-sm font-medium bg-amber-100 text-amber-800 dark:bg-amber-900/50 dark:text-amber-300';
        }

        const container = document.getElementById('targets');
        container.innerHTML = '';

        const targets = data.targets || [];
        if (targets.length === 0) {
          container.innerHTML = '<p class="text-gray-500 text-sm">No targets configured yet. Edit config.yaml and restart.</p>';
        }

        targets.forEach(t => {
          const card = document.createElement('div');
          card.className = 'bg-white dark:bg-gray-900/80 border border-gray-200 dark:border-gray-800 rounded-2xl p-5 shadow-sm hover:shadow-md transition-shadow';

          const isUp = t.up;
          const dotColor = isUp ? 'bg-emerald-500' : 'bg-red-500';
          const statusText = isUp ? 'Operational' : 'Down';
          const statusColor = isUp ? 'text-emerald-600 dark:text-emerald-400' : 'text-red-600 dark:text-red-400';

          const uptime = typeof t.uptime === 'number' ? t.uptime.toFixed(2) + '%' : '—';
          const latency = t.latency_ms ? t.latency_ms + ' ms' : (t.avg_latency ? Math.round(t.avg_latency) + ' ms avg' : '—');

          card.innerHTML = `
            <div class="flex items-start justify-between gap-4">
              <div class="flex items-start gap-3.5 min-w-0">
                <span class="mt-1.5 w-3 h-3 rounded-full ${dotColor} status-dot shrink-0"></span>
                <div class="min-w-0">
                  <h3 class="font-semibold text-base truncate">${escapeHtml(t.target)}</h3>
                  <p class="text-sm ${statusColor} mt-0.5">${statusText}</p>
                  ${t.last_error ? `<p class="text-xs text-gray-500 dark:text-gray-400 mt-1 truncate max-w-xs">${escapeHtml(t.last_error)}</p>` : ''}
                </div>
              </div>
              <div class="text-right shrink-0">
                <div class="text-sm font-medium tabular-nums">${uptime}</div>
                <div class="text-xs text-gray-500 dark:text-gray-400 mt-0.5 tabular-nums">${latency}</div>
                <div class="text-xs text-gray-400 mt-1">${formatRelative(t.last_check)}</div>
              </div>
            </div>
          `;
          container.appendChild(card);
        });

        // Incidents
        const incRes = await fetch('/api/incidents');
        const incidents = await incRes.json();
        const incBox = document.getElementById('incidents');

        if (!Array.isArray(incidents) || incidents.length === 0) {
          incBox.innerHTML = `
            <div class="text-center py-8 text-gray-500 dark:text-gray-400">
              <div class="text-3xl mb-2">🎉</div>
              <p class="text-sm">No recent incidents</p>
            </div>`;
        } else {
          incBox.innerHTML = incidents.slice(0, 12).map(i => `
            <div class="bg-white dark:bg-gray-900/80 border border-gray-200 dark:border-gray-800 rounded-xl p-4 flex justify-between items-start gap-4">
              <div class="min-w-0">
                <div class="font-medium text-red-600 dark:text-red-400 text-sm">${escapeHtml(i.target)}</div>
                <div class="text-xs text-gray-500 dark:text-gray-400 mt-1 line-clamp-2">${escapeHtml(i.error || 'Service unavailable')}</div>
              </div>
              <div class="text-xs text-gray-400 whitespace-nowrap shrink-0">
                ${formatTime(i.checked_at)}
              </div>
            </div>
          `).join('');
        }

        document.getElementById('last-updated').textContent = 'Updated ' + new Date().toLocaleTimeString();
      } catch (e) {
        console.error(e);
        document.getElementById('description').textContent = 'Unable to load status. Is the server running?';
        document.getElementById('overall-badge').textContent = 'Error';
        document.getElementById('overall-badge').className = 'px-4 py-1.5 rounded-full text-sm font-medium bg-red-100 text-red-800 dark:bg-red-900/50 dark:text-red-300';
      }
    }

    function escapeHtml(str) {
      if (!str) return '';
      return str.replace(/&/g, '&').replace(/</g, '<').replace(/>/g, '>').replace(/"/g, '"');
    }

    load();
    setInterval(load, 30000);
  </script>
</body>
</html>
